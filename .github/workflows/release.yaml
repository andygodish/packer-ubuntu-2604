name: Release (upver)

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      is_release_merge: ${{ steps.classify.outputs.is_release_merge }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify push
        id: classify
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE_VERSION=$(git show "$BEFORE:version.txt" | tr -d '[:space:]' | sed 's/^v//')
          AFTER_VERSION=$(git show "$AFTER:version.txt" | tr -d '[:space:]' | sed 's/^v//')
          if [ "$BEFORE_VERSION" != "$AFTER_VERSION" ]; then
            echo "is_release_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
          fi

  bump-and-pr:
    runs-on: ubuntu-latest
    needs: classify
    if: ${{ needs.classify.outputs.is_release_merge != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Compute from main so updating an open release PR does not consume
      # another revision from the pending release branch.
      - name: Install upver
        run: |
          curl -fsSL -o /usr/local/bin/upver \
            https://github.com/andygodish/upver/releases/download/v0.0.3/upver-linux-amd64
          chmod +x /usr/local/bin/upver
          upver --help >/dev/null || true

      - name: Run upver (apply + changelog)
        run: upver --apply --changelog

      - name: Create/Update release PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: release/upver
          title: "chore(release): update version.txt + changelog"
          commit-message: "chore(release): update version.txt + changelog"
          labels: |
            release
          add-paths: |
            version.txt
            CHANGELOG.md

  tag-release:
    runs-on: ubuntu-latest
    needs: classify
    if: ${{ needs.classify.outputs.is_release_merge == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          RAW_VERSION=$(tr -d '[:space:]' < version.txt)
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "v_version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        env:
          RELEASE_TAG: ${{ steps.ver.outputs.v_version }}
        run: |
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            EXISTING_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$EXISTING_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already belongs to $EXISTING_COMMIT; refusing to move it to $GITHUB_SHA." >&2
              exit 1
            fi
            echo "Tag $RELEASE_TAG already exists at this commit; nothing to publish."
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
